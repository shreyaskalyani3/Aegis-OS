#
# profile/pacman.conf — BUILD-TIME pacman configuration for mkarchiso
#
# This configures the repositories used while *assembling* the image. The
# running/installed system gets its own config from airootfs/etc/pacman.conf.
#
# The [aegis] Server line contains a placeholder that scripts/build-iso.sh
# rewrites to the absolute path of the locally-built package repository.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- BlackArch: the security tool arsenal (bootstrapped by build-iso.sh) -----
# strap.sh installs blackarch-keyring and writes this mirrorlist in the build
# environment. If AEGIS_ENABLE_BLACKARCH=0, build-iso.sh strips this block.
[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist

# --- Local Aegis repository (custom aegis-* packages) ------------------------
# build-iso.sh rewrites __AEGIS_LOCAL_REPO__ to the real absolute path.
[aegis]
SigLevel = Optional TrustAll
Server = file://__AEGIS_LOCAL_REPO__
