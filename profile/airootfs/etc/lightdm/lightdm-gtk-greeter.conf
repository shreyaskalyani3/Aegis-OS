# Aegis OS — LightDM GTK greeter appearance
# This greeter doubles as the lock screen: Aegis has no separate screen
# locker, `xflock4` falls through to `dm-tool lock`, and LightDM re-shows this
# greeter in lock mode. Keep it on-brand.
[greeter]
theme-name = adw-gtk3-dark
icon-theme-name = Papirus-Dark
font-name = Noto Sans 11
background = /usr/share/backgrounds/aegis/aegis-wallpaper.svg
user-background = false
# The shield emblem from our hicolor icon set, not the stock padlock.
default-user-image = #aegis
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %a %d %b  %H:%M
# The previous value — "50%,center 55%,center" — was malformed: a stray space
# and a duplicated coordinate pair, which GTK silently treated as unparseable
# and ignored. "x,y" with one pair is the accepted form.
position = 50%,center
