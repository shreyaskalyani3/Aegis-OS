#
# /etc/pacman.conf — Aegis OS (running/installed system)
#
# See the pacman.conf(5) manpage for option details.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
Color
ILoveCandy
ParallelDownloads = 8
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- BlackArch: the 2800+ tool arsenal --------------------------------------
# Install tools individually (`pacman -S <tool>`) or by group (`aegis-tools`).
# List groups:   pacman -Sg | grep '^blackarch'
# Install group: sudo pacman -S blackarch-scanner
[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist

# --- Aegis online repository (uncomment once you host it) --------------------
# Holds the aegis-* packages for update after install. Point Server at your
# hosted repo. Until then, aegis-* packages come baked into the image.
#[aegis]
#SigLevel = Optional TrustAll
#Server = https://repo.aegis-os.example/$arch
