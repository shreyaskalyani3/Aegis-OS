# Aegis OS — mkinitcpio additions.
#
# The installed system's /etc/mkinitcpio.conf is the stock mkinitcpio default
# (shellprocess@bootprep removes the live-only conf.d/archiso.conf drop-in that
# carries the live HOOKS). This drop-in reassigns HOOKS with the stock set plus
# plymouth, so the installed system boots with the animated Aegis splash too.
# The live medium keeps the conf.d/archiso.conf HOOKS — build-iso.sh injects
# plymouth into those at build time (this file sources before archiso.conf, so
# the live set wins there, as intended).
#
# plymouth goes after udev (it needs /dev ready) and before consolefont.
HOOKS=(base udev autodetect microcode modconf kms plymouth keyboard keymap consolefont block filesystems fsck)
