# =============================================================================
#  Aegis OS — live session credentials.
#
#  Read by /usr/local/bin/aegis-credentials (and aegis-live-setup) at boot.
#  scripts/build-iso.sh REGENERATES this file from aegis.conf at build time, so
#  AEGIS_LIVE_PASSWORD / AEGIS_ROOT_PASSWORD in aegis.conf are what actually
#  control the shipped credentials. The values below are the defaults used if
#  the image is built without that wrapper (e.g. a bare `mkarchiso` run).
#
#  Sourced by bash, so values are shell-quoted literals. build-iso.sh emits them
#  with printf %q, which round-trips arbitrary passwords safely.
#
#  Live medium only: Calamares deletes this file during install (see
#  etc/calamares/modules/shellprocess.conf), and both scripts that read it exit
#  early unless /run/archiso is present.
# =============================================================================
AEGIS_LIVE_USER=aegis
AEGIS_LIVE_PASSWORD=aegis
AEGIS_ROOT_PASSWORD=aegis
AEGIS_DEFAULT_SHELL=/usr/bin/zsh
