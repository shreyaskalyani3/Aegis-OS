[main]
plugins=keyfile

[keyfile]
# On a live medium there is no /etc/hostname at NM start; without this NM
# derives one from the MAC address and hostnamed later disagrees with the
# hostname aegis-credentials writes.
hostname-mode=none

[device]
# Never manage container/lab bridges and veths (docker0, br-*, veth*).
# NM touching these breaks container networking in security labs.
unmanaged-devices=interface-name:docker0;interface-name:br-*;interface-name:veth*;interface-name:virbr*

[connection]
# Plain DHCP ethernet and open wifi connect automatically on the live ISO.
ipv4.dhcp-timeout=60
# Keep the wireless radio at full power for monitor-mode stability
# (airmon-ng/airodump-ng drops with aggressive power saving).
wifi.powersave=2

[logging]
level=INFO
