# =============================================================================
#  Aegis OS — Calamares installer configuration
# =============================================================================
#  Offline installer: clones the live SquashFS to disk (unpackfs), then
#  configures the target in a chroot. Post-unpack steps remove archiso-only
#  artifacts, and a final verification instance proves the bootloader is
#  really on the disk/ESP before the "Restart now" button appears.
# =============================================================================
---
modules-search: [ local ]

# Two shellprocess instances with separate configs:
#  - "bootprep":  kernel restore + preset swap + live-artifact cleanup,
#                 runs BEFORE initcpio.
#  - "verify":    bootloader verification + repair, runs AFTER bootloader.
instances:
- id:       bootprep
  module:   shellprocess
  config:   shellprocess.conf
- id:       verify
  module:   shellprocess
  config:   shellprocess-verify.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  # bootprep restores /boot (kernel from /usr/lib/modules — mkarchiso empties
  # /boot in the SquashFS) and swaps the archiso live mkinitcpio preset for
  # the standard one, BEFORE initcpio runs.
  - shellprocess@bootprep
  - services-systemd
  - initcpio
  - grubcfg
  - bootloader
  # verify: proves grub code actually landed on the ESP (UEFI) or the MBR
  # (BIOS), repairs it if the bootloader module silently skipped grub-install,
  # and FAILS the install loudly if the disk would not boot. Runs BEFORE
  # umount so it can still see the mounted target.
  - shellprocess@verify
  - umount
- show:
  - finished

branding: aegis

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
