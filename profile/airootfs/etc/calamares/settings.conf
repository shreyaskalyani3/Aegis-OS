# =============================================================================
#  Aegis OS — Calamares installer configuration
# =============================================================================
#  Offline installer: clones the live SquashFS to disk (unpackfs), then
#  configures the target in a chroot. A post-install step (shellprocess)
#  removes archiso-only artifacts so the installed system boots natively.
# =============================================================================
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess
  - services-systemd
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: aegis

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
