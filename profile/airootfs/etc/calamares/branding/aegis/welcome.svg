<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aegis OS — installer welcome image (Calamares productWelcome).
  Displayed at ~320x150 on the welcome page. Design: centered shield emblem
  inside radar/crosshair rings on a dark grid — a "target acquisition" motif
  for a security OS. 640x300 canvas, all vector (no raster, no blur).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="55%" stop-color="#e01e3c"/>
      <stop offset="100%" stop-color="#a30f26"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7d94"/>
      <stop offset="100%" stop-color="#c21a35"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2e4d" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#ff2e4d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff2e4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="300" rx="12" fill="url(#bgGrad)"/>

  <!-- Faint grid (terminal/blueprint vibe) -->
  <g stroke="#30363d" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 60 H640 M0 120 H640 M0 180 H640 M0 240 H640"/>
    <path d="M80 0 V300 M200 0 V300 M440 0 V300 M560 0 V300"/>
  </g>

  <!-- Center emblem: glow + crosshair rings -->
  <circle cx="150" cy="150" r="145" fill="url(#glowGrad)"/>
  <g fill="none" stroke="#39c5cf" stroke-opacity="0.55">
    <circle cx="150" cy="150" r="120" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="150" cy="150" r="96" stroke-width="1.2" stroke-dasharray="60 22 8 22"/>
    <circle cx="150" cy="150" r="128" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <!-- Crosshair ticks -->
  <g stroke="#39c5cf" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M150 22 V40"/><path d="M150 260 V278"/>
    <path d="M22 150 H40"/><path d="M260 150 H278"/>
  </g>
  <!-- Corner brackets (HUD look) -->
  <g fill="none" stroke="#39c5cf" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M26 26 H14 V38"/><path d="M274 26 H286 V38"/>
    <path d="M26 274 H14 V262"/><path d="M274 274 H286 V262"/>
  </g>

  <!-- Shield -->
  <g transform="translate(150,150) scale(0.24) translate(-256,-256)">
    <path d="M256 13.3 L426.7 74.7 L426.7 272
             C426.7 389 344 461 256 498.7
             C168 461 85.3 389 85.3 272 L85.3 74.7 Z"
          fill="url(#shieldGrad)"/>
    <path d="M256 13.3 L426.7 74.7 L426.7 272
             C426.7 389 344 461 256 498.7
             C168 461 85.3 389 85.3 272 L85.3 74.7 Z"
          fill="none" stroke="url(#rimGrad)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M256 128 L373.3 394.7 L305.3 394.7 L281.6 330.7 L230.4 330.7
             L206.9 394.7 L138.7 394.7 Z
             M256 218.7 L237.9 277.3 L274.1 277.3 Z"
          fill="#ffffff" fill-rule="evenodd"/>
  </g>

  <!-- Scan line sweep across the shield -->
  <rect x="34" y="148" width="232" height="3" rx="1.5" fill="#39c5cf" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="330" y="140" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="56" font-weight="bold" letter-spacing="9"
        fill="url(#textGrad)">AEGIS</text>
  <text x="332" y="172" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="16" letter-spacing="6" fill="#8b949e">SECURITY · OS</text>

  <!-- Terminal prompt line -->
  <text x="332" y="210" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="15" fill="#39c5cf"><tspan fill="#ff2e4d">❯</tspan> aegis --install</text>
  <rect x="508" y="198" width="9" height="15" fill="#39c5cf" opacity="0.85"/>

  <!-- Accent rule -->
  <rect x="332" y="228" width="220" height="3" rx="1.5" fill="#ff2e4d"/>
  <text x="332" y="256" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="13" letter-spacing="4" fill="#8b949e">SENTINEL · AGENT-NATIVE</text>
</svg>
