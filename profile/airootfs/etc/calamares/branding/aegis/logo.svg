<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aegis OS — installer branding logo (Calamares productLogo / productIcon).

  Drawn on a 512 grid for LARGE sizes (sidebar shows it at 80x80, HiDPI up to
  240x240). This is NOT the panel icon (that one lives in hicolor and is tuned
  for 20px); this version carries the fine rim, gradient sheen and crisp
  letterform that only survive at high resolution.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="55%" stop-color="#e01e3c"/>
      <stop offset="100%" stop-color="#a30f26"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7d94"/>
      <stop offset="100%" stop-color="#c21a35"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M256 13.3 L426.7 74.7 L426.7 272
           C426.7 389 344 461 256 498.7
           C168 461 85.3 389 85.3 272 L85.3 74.7 Z"
        fill="url(#shield)"/>

  <!-- Top sheen: reads as glass at large sizes, invisible at small ones -->
  <path d="M256 13.3 L426.7 74.7 L426.7 272
           C426.7 389 344 461 256 498.7
           C168 461 85.3 389 85.3 272 L85.3 74.7 Z"
        fill="url(#sheen)"/>

  <!-- Crisp rim -->
  <path d="M256 13.3 L426.7 74.7 L426.7 272
           C426.7 389 344 461 256 498.7
           C168 461 85.3 389 85.3 272 L85.3 74.7 Z"
        fill="none" stroke="url(#rim)" stroke-width="14"
        stroke-linejoin="round"/>

  <!-- Center seam highlight: vertical light edge down the top half -->
  <path d="M256 13.3 L256 120" stroke="#ffd9e0" stroke-width="5"
        stroke-linecap="round" opacity="0.65"/>

  <!-- 'A' letterform, refined for large rendering -->
  <path d="M256 128 L373.3 394.7 L305.3 394.7 L281.6 330.7 L230.4 330.7
           L206.9 394.7 L138.7 394.7 Z
           M256 218.7 L237.9 277.3 L274.1 277.3 Z"
        fill="#ffffff" fill-rule="evenodd"/>

  <!-- Subtle inner shadow above the baseline of the A -->
  <path d="M138.7 394.7 L206.9 394.7 L230.4 330.7 L281.6 330.7 L305.3 394.7 L373.3 394.7"
        fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="3"/>
</svg>
