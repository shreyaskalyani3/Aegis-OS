# Aegis OS — installer finish page
#
# restartNowMode: user-checked -> the "Restart now" checkbox appears on the
# final page, CHECKED by default (one click to reboot into the new system).
# restartNowCommand: the command Calamares runs for that reboot.
---
restartNowMode: user-checked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: true
