# Aegis OS — bootloader (GRUB, BIOS + UEFI)
#
# grubMkconfig points at the Aegis wrapper (shipped in the SquashFS at
# /usr/share/aegis/grub-mkconfig-wrapper): it repairs the two chroot quirks
# that break grub-probe (host /proc in /etc/mtab, missing /boot/grub),
# captures ALL grub-mkconfig output to /var/log/aegis-grub-mkconfig.log in
# the target, and re-prints the real error to stderr on failure — so the
# installer shows the actual reason instead of bare "error code 1".
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "5"
bootloaderEntryName: "Aegis OS"
efiBootloaderId: "AegisOS"
kernelParams: [ "quiet" ]
grubInstall: "grub-install"
grubMkconfig: "/usr/share/aegis/grub-mkconfig-wrapper"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
