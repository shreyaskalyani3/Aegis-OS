# Aegis OS — locale defaults (user can change on the locale page)
#
# region/zone follow the IANA model the locale page indexes: the pair must
# resolve to a real /usr/share/zoneinfo/<region>/<zone>. "UTC" is not a region;
# the canonical spelling of UTC in that model is region "Etc", zone "UTC".
# A wrong pair makes the preselection silently fall back to the first zone
# in the list (Europe/Abu_Dhabi on most builds).
---
region: "Etc"
zone: "UTC"
localeGenPath: "/etc/locale.gen"
