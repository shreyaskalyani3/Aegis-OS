# Aegis OS — mount module (Calamares 3.3 schema)
#
# WHY THIS FILE EXISTS: without it, Calamares falls back to empty extraMounts,
# so /proc, /sys, /dev are NOT bind-mounted into the target before the exec
# phase — and every chrooted step that needs a real kernel view fails. The
# first casualty is `mkinitcpio` in the initcpio module, which aborts with:
#     ==> /proc must be mounted!
#     Command mkinitcpio finished with exit code 1
# and the whole install dies. These binds are mandatory on an Arch target
# (they are what every "arch-install-scripts" guide tells you to mount).
#
# extraMounts run for EVERY install; entries with efi: true only on UEFI.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    # The live boot medium, so the installer can copy the kernel + microcode
    # images into the target OFFLINE (mkarchiso empties /boot and the pacman
    # cache from the SquashFS, but the real files live here on the medium).
    # A plain bind does not carry submounts, so bootmnt is bound separately.
    - device: /run/archiso
      mountPoint: /run/archiso
      options: [ bind ]
    - device: /run/archiso/bootmnt
      mountPoint: /run/archiso/bootmnt
      options: [ bind ]

# Btrfs subvolume layout used when the user picks btrfs (any auto mode).
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
