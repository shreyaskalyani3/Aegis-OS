# Aegis OS — partitioning (Calamares 3.3 schema)
# ---
# EFI options. The old flat key efiSystemPartition is a deprecated alias in
# 3.3 — use the nested efi: map. 512MiB so future kernels/initramfs pairs
# and multiple boot entries always fit (the 300MiB default gets tight once
# GRUB + fallback initramfs + Windows dual-boot entries pile up).
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        32MiB
    label:              "EFI"

# Swap choices offered in autogenerated partitioning.
userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # Swap file instead of partition

# LUKS version created when the user encrypts. GRUB cannot unlock LUKS2 with
# the default Argon2id KDF, so luks1 is the safe default (same as upstream).
luksGeneration: luks1

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

# Do NOT pre-select "erase disk" — that wipes the target with one accidental
# click. "none" forces a conscious choice, which is what upstream recommends
# and what a security distro should do.
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType:  "ext4"
availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"
    - "f2fs"

# The live medium's own mounts must never be cleared by the ClearMounts job.
essentialMounts: [ "live-*", "control", "ventoy" ]
