# Aegis OS — drop the live-only installer launchers from the installed target's
# skeleton. Runs in the target chroot right after unpackfs and BEFORE the users
# module copies /etc/skel to the new user's home, so a freshly installed system
# never shows an "Install Aegis OS" icon on the desktop or in the panel. The
# live medium keeps its own copy — see usr/share/aegis/drop-install-launcher.
---
dontChroot: false
timeout: 30
script:
  - command: "/usr/share/aegis/drop-install-launcher"
    timeout: 30
