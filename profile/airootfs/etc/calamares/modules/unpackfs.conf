# Aegis OS — clone the live SquashFS onto the target.
#
# The kernel/microcode situation is handled OUTSIDE this file: mkarchiso
# deletes /boot from the SquashFS (kernels live in the ISO's outer boot dir),
# so instead of copying raw kernel files (which leaves no pacman database
# entry and no preset), build-iso.sh pre-downloads the kernel PACKAGES into
# /usr/share/aegis/packages inside the image, and the shellprocess module
# `pacman -U`s them into the target during install — the same offline
# pattern EndeavourOS uses. This entry therefore only clones the root
# filesystem itself.
#
# Source path matches profiledef.sh: install_dir="aegis", arch="x86_64",
# airootfs_image_type="squashfs" => airootfs.sfs. archiso mounts the boot
# medium at /run/archiso/bootmnt.
---
unpack:
  - source: "/run/archiso/bootmnt/aegis/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
