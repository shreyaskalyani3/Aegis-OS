# Aegis OS — clone the live SquashFS onto the target, plus kernel/microcode.
#
# WHY THE EXTRA ENTRIES: mkarchiso deletes /boot from the SquashFS (kernels
# live in the ISO's outer boot directory), so a target cloned from the image
# alone has no /boot/vmlinuz-linux and `mkinitcpio -P` fails with
# "-k /boot/vmlinuz-linux must be readable". The kernel and CPU microcode
# images are on the boot medium — the exact same place this module already
# reads airootfs.sfs from — so plain "file" entries copy them into the
# target /boot at unpack time. This is fully OFFLINE and needs no bind
# mounts, no pacman, no network.
#
# Source paths match profiledef.sh: install_dir="aegis", arch="x86_64".
# The 'file' sourcefs copies the file (not a filesystem image) to the
# destination; the trailing filename is preserved by rsync semantics.
---
unpack:
  - source: "/run/archiso/bootmnt/aegis/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""

  # Kernel: mandatory (its absence is exactly the mkinitcpio failure).
  # Copy the single file into /boot — source is the medium's boot file.
  - source: "/run/archiso/bootmnt/aegis/boot/x86_64/vmlinuz-linux"
    sourcefs: "file"
    destination: "/boot"

  # CPU microcode: either one exists on the medium, never both; both are
  # optional so a missing one skips cleanly instead of failing the install.
  - source: "/run/archiso/bootmnt/aegis/boot/intel-ucode.img"
    sourcefs: "file"
    destination: "/boot"
    optional: true
  - source: "/run/archiso/bootmnt/aegis/boot/amd-ucode.img"
    sourcefs: "file"
    destination: "/boot"
    optional: true
