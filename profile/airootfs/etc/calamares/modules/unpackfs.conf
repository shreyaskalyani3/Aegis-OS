# Aegis OS — clone the live SquashFS onto the target.
# The source path matches profiledef.sh: install_dir="aegis", arch="x86_64",
# airootfs_image_type="squashfs" => airootfs.sfs. archiso mounts the boot
# medium at /run/archiso/bootmnt.
---
unpack:
  - source: "/run/archiso/bootmnt/aegis/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
