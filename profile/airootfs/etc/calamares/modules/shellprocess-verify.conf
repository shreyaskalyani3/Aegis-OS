# Aegis OS — bootloader verification instance (runs AFTER the bootloader
# module, BEFORE umount). Executes /usr/share/aegis/verify-bootloader in the
# target chroot: proves the kernel/initramfs/grub.cfg exist and that GRUB
# code really landed on the ESP (UEFI, including the firmware fallback path)
# or the MBR (BIOS). Repairs by re-running grub-install when missing, and
# fails the install with a clear AEGIS-ERROR if the disk would not boot —
# instead of a green "installation finished" followed by a dead machine.
---
dontChroot: false
timeout: 300
script:
  - "/usr/share/aegis/verify-bootloader"
