# Aegis OS — initcpio module (initramfs generation on the target)
#
# Runs mkinitcpio in the target chroot. The kernel preset situation:
#   * the 'linux' package (reinstalled by the packages module, unpackfs clones
#     a SquashFS whose /boot mkarchiso emptied) ships the standard preset
#   * the shellprocess step before this also force-writes the standard preset
#     over the archiso live one, as a belt-and-braces net
# So `mkinitcpio -P` here builds the normal default+fallback initramfs pair.
---
kernel: linux

be_unsafe: false
