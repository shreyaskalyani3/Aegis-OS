# Aegis OS — post-unpack cleanup + kernel/boot preparation, runs in the target
# chroot before initcpio. This is the EndeavourOS pattern, adapted:
# their production installer (endeavouros-team/calamares, eos_bootloader
# module) never reinstalls the kernel package — because the kernel image
# survives inside the SquashFS at /usr/lib/modules/<version>/vmlinuz
# (mkarchiso only deletes /boot). They copy it to /boot and let the initramfs
# generator + bootloader modules do the rest. We do exactly that, with loud
# fail-fast checks at every step.
---
dontChroot: false
timeout: 600
script:
  # --- 1. Restore the kernel to /boot (EOS pattern) ----------------------------
  # The linux package ships the kernel at BOTH /boot/vmlinuz-linux and
  # /usr/lib/modules/<ver>/vmlinuz. mkarchiso deletes only /boot, so the
  # modules copy is still in the cloned target. Find it and copy it back —
  # no pacman, no keyring, no signature games, fully offline.
  - command: "kimg=$(ls -1 /usr/lib/modules/*/vmlinuz 2>/dev/null | head -n1); test -n \"$kimg\" || { echo 'AEGIS-ERROR: no kernel image found under /usr/lib/modules/*/vmlinuz - the SquashFS clone is broken.' >&2; exit 1; }; install -D -m 0644 \"$kimg\" /boot/vmlinuz-linux; echo \"AEGIS: kernel restored: $kimg -> /boot/vmlinuz-linux\""
    timeout: 30
  # --- 2. Standard mkinitcpio preset, not the archiso live one -----------------
  # build-iso.sh imports releng's live preset (PRESETS=('archiso')) for the
  # live medium; an installed system must use the standard default/fallback
  # preset or mkinitcpio -P fails / builds a live-only initramfs.
  - command: "test -r /usr/share/aegis/linux-install.preset || { echo 'AEGIS-ERROR: /usr/share/aegis/linux-install.preset missing from the target.' >&2; exit 1; }; cp /usr/share/aegis/linux-install.preset /etc/mkinitcpio.d/linux.preset"
    timeout: 10
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - command: "grep -q \"^PRESETS=('default' 'fallback')\" /etc/mkinitcpio.d/linux.preset || { echo 'AEGIS-ERROR: preset swap failed.' >&2; exit 1; }"
    timeout: 10
  # --- 3. Install bootloader + microcode packages offline (EOS pattern) --------
  # grub/os-prober are needed by grub-mkconfig's 30_os-prober and grub-install;
  # intel-ucode/amd-ucode ship their images as /boot/*-ucode.img — deleted by
  # mkarchiso's /boot cleanup — so they must be RE-installed from the ISO's
  # package cache to restore the microcode images the mkinitcpio `microcode`
  # hook embeds into every initramfs. All from /usr/share/aegis/packages
  # (no signatures shipped; LocalFileSigLevel=Optional). The kernel package
  # itself is NOT reinstalled — step 1 restored it from /usr/lib/modules.
  - command: "if ls /usr/share/aegis/packages/grub-*.pkg.tar.zst >/dev/null 2>&1; then pacman -U --noconfirm --overwrite '*' /usr/share/aegis/packages/grub-*.pkg.tar.zst /usr/share/aegis/packages/intel-ucode-*.pkg.tar.zst /usr/share/aegis/packages/amd-ucode-*.pkg.tar.zst || { echo 'AEGIS-ERROR: offline grub/microcode package install failed.' >&2; exit 1; }; else echo 'AEGIS: no package cache (grub/microcode already present), continuing'; fi"
    timeout: 300
  # --- 4. Verify everything the initcpio + bootloader modules need -------------
  - command: "test -r /boot/vmlinuz-linux || { echo 'AEGIS-ERROR: /boot/vmlinuz-linux missing after the restore step.' >&2; exit 1; }"
    timeout: 10
  # Live-only files (defensive: normally absent from the SquashFS).
  - "rm -f /etc/sudoers.d/99-aegis-live"
  - "rm -f /etc/lightdm/lightdm.conf.d/20-aegis-live.conf"
  # The live polkit "never ask for a password" rule. aegis-credentials only
  # writes it when /run/archiso exists, so it should not be here — remove it
  # anyway, because an installed system must authenticate normally.
  - "rm -f /etc/polkit-1/rules.d/49-aegis-live.rules"
  # Live credentials in plaintext — must never survive onto the installed system,
  # which gets its own root/user passwords from the Calamares users module.
  - "rm -f /etc/aegis/credentials.conf"
  # The live oneshots are no-ops off the live medium (both guard on /run/archiso);
  # disable them anyway so the installed system never re-applies live credentials.
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-live-setup.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-credentials.service"
  # Live-only NetworkManager tuning (monitor-mode power saving, container
  # unmanaged-devices, live hostname mode). The installed system configures
  # networking through the networkcfg module instead.
  - "rm -f /etc/NetworkManager/system-connections/Wired-connection.nmconnection"
  - "rm -f /etc/NetworkManager/conf.d/20-aegis.conf"
  # mkinitcpio-archiso and friends are live-medium-only hooks; their presence
  # makes `mkinitcpio -P` try to install archiso hooks into the installed
  # system's initramfs (EOS removes them too, in chrooted_cleaner_script.sh).
  - "pacman -Rns --noconfirm mkinitcpio-archiso mkinitcpio-nfs-utils 2>/dev/null || true"
  # Ensure the installed machine gets a fresh hostname/hosts if desired later.
  - command: "true"
    timeout: 5
