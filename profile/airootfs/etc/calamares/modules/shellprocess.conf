# Aegis OS — post-unpack cleanup, run in the target chroot before initcpio.
# Strips artifacts that only make sense on the live medium so the installed
# system boots natively and cleanly.
---
dontChroot: false
timeout: 600
script:
  # --- Install the kernel package into the target (offline, EOS pattern) ------
  # build-iso.sh pre-downloads linux/intel-ucode/amd-ucode/grub packages into
  # /usr/share/aegis/packages (a directory mkarchiso cleanup never touches),
  # and unpackfs clones them into the target. Installing the real package
  # with pacman -U gives the target an authentic kernel: /boot/vmlinuz-linux,
  # correct file ownership and a pacman database entry — everything
  # mkinitcpio needs, fully offline. LocalFileSigLevel=Optional in the
  # runtime pacman.conf makes -U on the cache copy work without keyring games.
  #
  # ORDER MATTERS: the 90-mkinitcpio-install pacman hook fires DURING
  # `pacman -U` (PostTransaction) and runs `mkinitcpio -p linux` itself, so
  # the live archiso preset MUST already be gone before the install starts —
  # otherwise the hook builds a LIVE initramfs (archiso hooks expecting the
  # boot medium) into the target. The swap and the live-HOOKS removal happen
  # FIRST, then pacman -U.
  - command: "ls /usr/share/aegis/packages/linux-*.pkg.tar.zst >/dev/null 2>&1 || { echo 'AEGIS-ERROR: offline kernel package cache missing at /usr/share/aegis/packages - the ISO was built without the kernel cache step. Rebuild the ISO with current scripts/build-iso.sh.' >&2; exit 1; }"
    timeout: 10
  # Replace the archiso LIVE preset (PRESETS=('archiso'), live HOOKS) with the
  # standard installed-system preset BEFORE the kernel package installs, so
  # both the pacman hook's mkinitcpio AND the initcpio module build normal
  # initramfs images.
  - "cp /usr/share/aegis/linux-install.preset /etc/mkinitcpio.d/linux.preset"
  # Remove the live HOOKS drop-in (same reason: the hook's mkinitcpio would
  # otherwise read /etc/mkinitcpio.conf.d/archiso.conf and build for the live
  # medium).
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - command: "grep -q \"^PRESETS=('default' 'fallback')\" /etc/mkinitcpio.d/linux.preset || { echo 'AEGIS-ERROR: preset swap failed - linux.preset is still the archiso live preset.' >&2; exit 1; }"
    timeout: 10
  # Install the ENTIRE offline cache in ONE pacman transaction. 'linux'
  # depends on the virtual `initramfs` provider, and the target chroot has
  # no sync databases to resolve it from — but the cache contains the
  # provider (mkinitcpio, pulled automatically by -Sw at build time), so
  # installing every cached package together satisfies the dependency
  # within the same transaction. Globs end at .pkg.tar.zst (no *.pkg.tar.*
  # which would match .sig strays); the build deletes signatures and
  # databases from the cache, and LocalFileSigLevel=Optional means pacman
  # never touches the keyring. NO --needed: 'linux' is already in the
  # target's pacman DB (recorded by the SquashFS), so --needed would skip
  # it and /boot would stay empty.
  - "pacman -U --noconfirm --overwrite '*' /usr/share/aegis/packages/*.pkg.tar.zst"
  # Verify the kernel and preset are exactly right (loud failures, not cryptic
  # mkinitcpio errors later).
  - command: "test -r /boot/vmlinuz-linux || { echo 'AEGIS-ERROR: /boot/vmlinuz-linux missing after pacman -U of the kernel package.' >&2; exit 1; }"
    timeout: 10
  - command: "test -r /boot/initramfs-linux.img || { echo 'AEGIS-ERROR: /boot/initramfs-linux.img missing - the mkinitcpio hook did not run during pacman -U (check /var/log/pacman.log in the target).' >&2; exit 1; }"
    timeout: 10
  # Live-only overlay files (defensive: normally absent from the SquashFS).
  - "rm -f /etc/sudoers.d/99-aegis-live"
  - "rm -f /etc/lightdm/lightdm.conf.d/20-aegis-live.conf"
  # The live polkit "never ask for a password" rule. aegis-credentials only
  # writes it when /run/archiso exists, so it should not be here — remove it
  # anyway, because an installed system must authenticate normally.
  - "rm -f /etc/polkit-1/rules.d/49-aegis-live.rules"
  # Live credentials in plaintext — must never survive onto the installed system,
  # which gets its own root/user passwords from the Calamares users module.
  - "rm -f /etc/aegis/credentials.conf"
  # The live oneshots are no-ops off the live medium (both guard on /run/archiso);
  # disable them anyway so the installed system never re-applies live credentials.
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-live-setup.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-credentials.service"
  # Live-only NetworkManager tuning (monitor-mode power saving, container
  # unmanaged-devices, live hostname mode). The installed system configures
  # networking through the networkcfg module instead. 20-aegis.conf is
  # documented as live-only and the connection profile is a generic
  # "any ethernet" match that would fight per-machine connections.
  - "rm -f /etc/NetworkManager/system-connections/Wired-connection.nmconnection"
  - "rm -f /etc/NetworkManager/conf.d/20-aegis.conf"
  # Ensure the installed machine gets a fresh hostname/hosts if desired later.
  - command: "true"
    timeout: 5
