# Aegis OS — post-unpack cleanup, run in the target chroot before initcpio.
# Strips artifacts that only make sense on the live medium so the installed
# system boots natively and cleanly.
---
dontChroot: false
timeout: 600
script:
  # Remove the live HOOKS drop-in so `mkinitcpio -P` (initcpio module, next)
  # builds a normal initramfs instead of one that expects the live medium.
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  # Live-only overlay files (defensive: normally absent from the SquashFS).
  - "rm -f /etc/sudoers.d/99-aegis-live"
  - "rm -f /etc/lightdm/lightdm.conf.d/20-aegis-live.conf"
  # The live polkit "never ask for a password" rule. aegis-credentials only
  # writes it when /run/archiso exists, so it should not be here — remove it
  # anyway, because an installed system must authenticate normally.
  - "rm -f /etc/polkit-1/rules.d/49-aegis-live.rules"
  # Live credentials in plaintext — must never survive onto the installed system,
  # which gets its own root/user passwords from the Calamares users module.
  - "rm -f /etc/aegis/credentials.conf"
  # The live oneshots are no-ops off the live medium (both guard on /run/archiso);
  # disable them anyway so the installed system never re-applies live credentials.
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-live-setup.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-credentials.service"
  # Live-only NetworkManager tuning (monitor-mode power saving, container
  # unmanaged-devices, live hostname mode). The installed system configures
  # networking through the networkcfg module instead. 20-aegis.conf is
  # documented as live-only and the connection profile is a generic
  # "any ethernet" match that would fight per-machine connections.
  - "rm -f /etc/NetworkManager/system-connections/Wired-connection.nmconnection"
  - "rm -f /etc/NetworkManager/conf.d/20-aegis.conf"
  # Ensure the installed machine gets a fresh hostname/hosts if desired later.
  - command: "true"
    timeout: 5
