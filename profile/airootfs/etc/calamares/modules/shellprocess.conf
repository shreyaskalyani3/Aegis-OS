# Aegis OS — post-unpack cleanup, run in the target chroot before initcpio.
# Strips artifacts that only make sense on the live medium so the installed
# system boots natively and cleanly.
---
dontChroot: false
timeout: 600
script:
  # --- Restore /boot in the target (offline kernel copy) --------------------
  # mkarchiso deletes /boot from the SquashFS (kernels live in the ISO's outer
  # boot dir), so a target cloned by unpackfs has no vmlinuz-linux and
  # `mkinitcpio -P` fails with "-k /boot/vmlinuz-linux must be readable".
  # The real kernel + microcode images are on the boot medium, bound into the
  # target by the mount module's extraMounts. Each step FAILS THE INSTALL with
  # a clear message if the source is missing, rather than letting mkinitcpio
  # die later with a cryptic one.
  - command: "test -r /run/archiso/bootmnt/aegis/boot/x86_64/vmlinuz-linux || { echo 'AEGIS-ERROR: kernel image not found on the boot medium (expected /run/archiso/bootmnt/aegis/boot/x86_64/vmlinuz-linux) - is the live medium bind-mounted? See mount.conf extraMounts.' >&2; exit 1; }"
    timeout: 10
  - "install -D -m 0644 /run/archiso/bootmnt/aegis/boot/x86_64/vmlinuz-linux /boot/vmlinuz-linux"
  - "if [ -f /run/archiso/bootmnt/aegis/boot/intel-ucode.img ]; then install -D -m 0644 /run/archiso/bootmnt/aegis/boot/intel-ucode.img /boot/intel-ucode.img; fi"
  - "if [ -f /run/archiso/bootmnt/aegis/boot/amd-ucode.img ]; then install -D -m 0644 /run/archiso/bootmnt/aegis/boot/amd-ucode.img /boot/amd-ucode.img; fi"
  # Replace the archiso LIVE mkinitcpio preset (PRESETS=('archiso'), live
  # HOOKS config) with the standard installed-system preset. build-iso.sh
  # imports the live one for the live image; without this swap, `mkinitcpio
  # -P` in the initcpio module reads the live preset and fails. The preset
  # ships in the SquashFS (usr/share/aegis/), so unpackfs already cloned it
  # into the target at this point. Both the source and the result are
  # verified loudly.
  - command: "test -r /usr/share/aegis/linux-install.preset || { echo 'AEGIS-ERROR: /usr/share/aegis/linux-install.preset missing from the target - unpackfs did not clone the overlay correctly.' >&2; exit 1; }"
    timeout: 10
  - "cp /usr/share/aegis/linux-install.preset /etc/mkinitcpio.d/linux.preset"
  - command: "grep -q \"^PRESETS=('default' 'fallback')\" /etc/mkinitcpio.d/linux.preset || { echo 'AEGIS-ERROR: preset swap failed - linux.preset is still the archiso live preset.' >&2; exit 1; }"
    timeout: 10
  # Remove the live HOOKS drop-in so `mkinitcpio -P` (initcpio module, next)
  # builds a normal initramfs, not one that expects the live medium.
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - command: "test -r /boot/vmlinuz-linux || { echo 'AEGIS-ERROR: /boot/vmlinuz-linux still missing after the copy step.' >&2; exit 1; }"
    timeout: 10
  # Live-only overlay files (defensive: normally absent from the SquashFS).
  - "rm -f /etc/sudoers.d/99-aegis-live"
  - "rm -f /etc/lightdm/lightdm.conf.d/20-aegis-live.conf"
  # The live polkit "never ask for a password" rule. aegis-credentials only
  # writes it when /run/archiso exists, so it should not be here — remove it
  # anyway, because an installed system must authenticate normally.
  - "rm -f /etc/polkit-1/rules.d/49-aegis-live.rules"
  # Live credentials in plaintext — must never survive onto the installed system,
  # which gets its own root/user passwords from the Calamares users module.
  - "rm -f /etc/aegis/credentials.conf"
  # The live oneshots are no-ops off the live medium (both guard on /run/archiso);
  # disable them anyway so the installed system never re-applies live credentials.
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-live-setup.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/aegis-credentials.service"
  # Live-only NetworkManager tuning (monitor-mode power saving, container
  # unmanaged-devices, live hostname mode). The installed system configures
  # networking through the networkcfg module instead. 20-aegis.conf is
  # documented as live-only and the connection profile is a generic
  # "any ethernet" match that would fight per-machine connections.
  - "rm -f /etc/NetworkManager/system-connections/Wired-connection.nmconnection"
  - "rm -f /etc/NetworkManager/conf.d/20-aegis.conf"
  # Ensure the installed machine gets a fresh hostname/hosts if desired later.
  - command: "true"
    timeout: 5
