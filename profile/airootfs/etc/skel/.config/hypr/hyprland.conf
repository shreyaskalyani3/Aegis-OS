# =============================================================================
#  AEGIS OS — Master Hyprland Configuration (Aphotic Cyber Edition)
# =============================================================================
autogenerated = 0

# --- 1. Monitors -------------------------------------------------------------
# Default: auto-detect resolution, refresh rate, and optimal scaling.
monitor = , preferred, auto, 1

# --- 2. Environment Variables ------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,Breeze_Snow
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Breeze_Snow
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = AQ_NO_MODIFIERS,1

# --- 3. Autostart Daemons & Services ----------------------------------------
# D-Bus & systemd environment activation
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start graphical-session.target 2>/dev/null || true

# Polkit authentication agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# Notification daemon (Mako Cyber)
exec-once = mako &

# Cyber Status Bar (Waybar)
exec-once = waybar &

# Aphotic Quickshell Desktop Environment (Notch, Launcher, Command Center, Intelligence)
exec-once = sh -c 'systemctl --user start aphotic-shell.service || (pgrep -x qs || pgrep -x quickshell || qs -c aphotic &)'

# System Tray Utilities
exec-once = nm-applet --indicator &
exec-once = blueman-applet &

# VMware & VM Guest Integration (Auto-resize, Mouse, Clipboard)
exec-once = vmware-user-suid-wrapper 2>/dev/null || vmtoolsd -n vmusr 2>/dev/null &

# Wallpaper Daemon
exec-once = hyprpaper &
exec-once = awww init 2>/dev/null || true

# Clipboard History Management
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &

# Idle Management
exec-once = hypridle &

# Cyber Dark Theme / Font Synchronization
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Inter 10'
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name 'JetBrainsMono Nerd Font Mono 10'

# --- 4. Input & Devices ------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
}

# --- 5. Aesthetics & Layout --------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Glowing animated neon cyber border (Cyan -> Purple -> Emerald Green)
    col.active_border = rgb(00E5FF) rgb(7928CA) rgb(00FF9C) 45deg
    col.inactive_border = rgba(1a162baa)

    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12

    active_opacity = 0.94
    inactive_opacity = 0.84

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000088)
        offset = 0, 4
    }
}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 5, wind, slide
    animation = windowsIn, 1, 5, winIn, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 8, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    background_color = rgb(0c0a14)
}

# --- 6. Keybindings ----------------------------------------------------------
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, kitty || foot
bind = $mainMod, T, exec, kitty || foot
bind = $mainMod, E, exec, thunar
bind = $mainMod, SPACE, exec, qs -c aphotic ipc call launcher toggle || wofi --show drun
bind = $mainMod, A, exec, qs -c aphotic ipc call launcher toggle || wofi --show drun
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Aphotic & Quickshell Cyber Surfaces
bind = $mainMod, D, exec, qs -c aphotic ipc call dashboard toggle || wofi --show drun
bind = $mainMod, I, exec, qs -c aphotic ipc call settings toggle
bind = $mainMod, N, exec, qs -c aphotic ipc call notifications toggle
bind = $mainMod, M, exec, qs -c aphotic ipc call session toggle
bind = $mainMod, W, exec, qs -c aphotic ipc call wallpaperpicker toggle
bind = $mainMod, V, exec, aegis-clipboard
bind = $mainMod, K, exec, aegis-cheatsheet

# Aegis Security Arsenal & AI Agent
bind = $mainMod ALT, A, exec, kitty --title "Aegis AI Agent" aegis-ai
bind = $mainMod ALT, T, exec, kitty --title "Aegis Tools Arsenal" aegis-tools
bind = $mainMod ALT, I, exec, aegis-install

# Lock & Screenshots
bind = $mainMod, L, exec, aegis-lock
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot Captured" "Saved to ~/Pictures/Screenshots"
bind = $mainMod, R, exec, mkdir -p ~/Videos && wf-recorder -g "$(slurp)" -f ~/Videos/$(date +%Y-%m-%d_%H-%M-%S).mp4
bind = $mainMod SHIFT, R, exec, pkill wf-recorder && notify-send "Recording Stopped" "Saved to ~/Videos"

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r

# Window Movement
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspace Switching (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace (1 - 9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Media & Hardware Keys (with OSD)
bindle = , XF86AudioRaiseVolume, exec, pamixer -i 5 && notify-send -h string:x-canonical-private-synchronous:vol "Volume: $(pamixer --get-volume)%" -t 1000
bindle = , XF86AudioLowerVolume, exec, pamixer -d 5 && notify-send -h string:x-canonical-private-synchronous:vol "Volume: $(pamixer --get-volume)%" -t 1000
bindl = , XF86AudioMute, exec, pamixer -t && notify-send -h string:x-canonical-private-synchronous:vol "Mute Toggled" -t 1000
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5% && notify-send -h string:x-canonical-private-synchronous:bright "Brightness: $(brightnessctl get)%" -t 1000
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send -h string:x-canonical-private-synchronous:bright "Brightness: $(brightnessctl get)%" -t 1000
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- 7. Window Rules & Layer Blur --------------------------------------------
windowrulev2 = float, class:^(calamares)$
windowrulev2 = center, class:^(calamares)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(.blueman-manager-wrapped|blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(swappy)$
windowrulev2 = float, class:^(file-roller|org.gnome.FileRoller)$
windowrulev2 = float, class:^(Viewnior|viewnior)$
windowrulev2 = float, title:^(Open File|Open Folder|Save As|Save File)$
windowrulev2 = float, title:^(Aegis OS Keybindings)$

# Opacity Rules
windowrulev2 = opacity 0.92 0.92, class:^(kitty)$
windowrulev2 = opacity 0.88 0.88, class:^(thunar)$
windowrulev2 = opacity 0.88 0.88, class:^(pavucontrol)$

# Layer Blur for Cyber Surfaces
layerrule = blur, waybar
layerrule = blur, wofi
layerrule = blur, mako
layerrule = blur, aphotic-(.*)
layerrule = ignorealpha 0.2, waybar
layerrule = ignorealpha 0.2, aphotic-(.*)
