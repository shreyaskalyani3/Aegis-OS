# =============================================================================
#  AEGIS OS — Hyprlock Cyber Lockscreen Configuration
# =============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/aegis/aegis-cyber.jpg
    blur_passes = 3
    blur_size = 5
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(00E5FF)
    inner_color = rgba(12, 10, 20, 0.85)
    font_color = rgb(141, 218, 233)
    fade_on_empty = false
    placeholder_text = <span foreground="##6298a3">Enter Password...</span>
    hide_input = false
    check_color = rgb(00FF9C)
    fail_color = rgb(255, 0, 85)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -50
    halign = center
    valign = center
}

# Digital Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(00E5FF)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 229, 255, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(141, 218, 233)
    font_size = 18
    font_family = Inter
    position = 0, 30
    halign = center
    valign = center
}

# Aegis OS Banner
label {
    monitor =
    text = 🛡️ AEGIS OS — DEFENSE & INTELLIGENCE
    color = rgba(141, 218, 233, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
