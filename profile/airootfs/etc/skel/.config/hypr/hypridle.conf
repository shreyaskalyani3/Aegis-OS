# =============================================================================
#  AEGIS OS — Hypridle Configuration
# =============================================================================

general {
    # pgrep (procps-ng, always present on Arch base) instead of pidof
    # (sysvinit-tools, not guaranteed installed) — and pgrep -x avoids
    # matching unrelated processes whose cmdline contains "hyprlock".
    lock_cmd = pgrep -x hyprlock >/dev/null 2>&1 || aegis-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim screen after 5 minutes
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# Lock screen after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off displays after 15 minutes
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
