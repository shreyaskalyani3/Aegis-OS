# =============================================================================
#  Aegis OS — GTK 4 settings. Same reasoning as ../gtk-3.0/settings.ini.
#
#  adw-gtk-theme ships a gtk-4.0/ stylesheet as well as gtk-3.0/, so plain GTK4
#  apps pick the Aegis dark theme up from here. Apps built on libadwaita ignore
#  gtk-theme-name by design and follow the desktop's colour-scheme preference
#  instead; gtk-application-prefer-dark-theme is what steers those, so it is set
#  deliberately rather than copied.
# =============================================================================
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=menu:minimize,maximize,close
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
