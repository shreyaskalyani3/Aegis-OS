[Unit]
# Hyprland explicitly starts graphical-session.target after importing the
# Wayland/D-Bus environment. A pure Hyprland session does not promise to run
# ~/.config/autostart/*.desktop, so first-login and VirtualBox session helpers
# are pulled in here instead of depending on a desktop-specific autostart
# implementation.
Wants=aegis-first-login.service aegis-vbox-session.service
