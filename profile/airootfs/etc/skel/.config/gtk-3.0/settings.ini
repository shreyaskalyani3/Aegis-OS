# =============================================================================
#  Aegis OS — GTK 3 settings for the live/installed user.
#
#  KDE Plasma configures GTK integration via breeze-gtk and kde-gtk-config.
#  This file provides static first-frame defaults so GTK 3 applications
#  immediately match the desktop's dark appearance, even before the session
#  sync daemon runs.
#
#  Every name here must be backed by a package in packages.x86_64 —
#  check 7 of scripts/dev/check-profile.sh enforces that.
#    adw-gtk3-dark  <- adw-gtk-theme
#    Papirus-Dark   <- papirus-icon-theme
# =============================================================================
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=menu:minimize,maximize,close
gtk-button-images=1
gtk-menu-images=1
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
