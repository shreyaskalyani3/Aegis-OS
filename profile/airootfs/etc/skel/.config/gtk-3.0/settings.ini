# =============================================================================
#  Aegis OS — GTK 3 settings for the live/installed user.
#
#  Why this file exists even though xsettings.xml already sets Net/ThemeName:
#  those two are different delivery mechanisms. xfwm4, xfce4-panel and xfdesktop
#  read their xfconf channels directly, which is why the panel, the wallpaper and
#  the window-button layout all applied on first boot. GTK theming does not — it
#  arrives over XSETTINGS, broadcast by xfsettingsd, and anything that starts
#  outside a healthy XFCE session (a polkit agent, a root GUI, an app launched
#  from a VT) never receives it and renders in stock light Adwaita.
#
#  That is what put a bright grey authentication dialog in the middle of a dark
#  desktop. GTK reads this file directly at startup, so the theme no longer
#  depends on xfsettingsd being up. xsettings.xml stays as-is: when the session
#  is healthy it agrees with this file, and it is what Settings → Appearance
#  edits.
#
#  Every name here must be backed by a package in packages.x86_64 —
#  check 7 of scripts/dev/check-profile.sh enforces that.
#    adw-gtk3-dark  <- adw-gtk-theme
#    Papirus-Dark   <- papirus-icon-theme
# =============================================================================
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=menu:minimize,maximize,close
gtk-button-images=1
gtk-menu-images=1
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
