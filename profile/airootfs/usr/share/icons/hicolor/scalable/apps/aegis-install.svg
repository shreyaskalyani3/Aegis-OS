<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aegis OS — "Install Aegis OS" launcher icon (disk platter + shield download arrow).
  Shares the wallpaper palette so panel/menu art matches the desktop.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#b3122e"/>
    </linearGradient>
  </defs>

  <g transform="translate(24 20) scale(0.125)">
    <path d="M0 -150 L128 -104 L128 44 C128 132 66 186 0 214 C-66 186 -128 132 -128 44 L-128 -104 Z"
          fill="url(#shield)" opacity="0.92"/>
    <path d="M0 -150 L128 -104 L128 44 C128 132 66 186 0 214 C-66 186 -128 132 -128 44 L-128 -104 Z"
          fill="none" stroke="url(#shield)" stroke-width="18" stroke-linejoin="round"/>

    <!-- download arrow: write the OS to disk -->
    <g fill="#f0f6fc">
      <rect x="-16" y="-96" width="32" height="88"/>
      <path d="M-56 -20 L56 -20 L0 56 Z"/>
    </g>
    <!-- disk / target drive -->
    <rect x="-84" y="92" width="168" height="34" rx="17" fill="#f0f6fc"/>
  </g>
</svg>
