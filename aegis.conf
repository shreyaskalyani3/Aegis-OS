# =============================================================================
#  Aegis OS — central build configuration (single source of truth)
# =============================================================================
#  Every build script and packaging step sources this file. Change branding,
#  versioning, the default user, or repository URLs here and it propagates
#  everywhere. Keep values shell-safe (no spaces without quotes).
# -----------------------------------------------------------------------------

# --- Identity ----------------------------------------------------------------
AEGIS_NAME="Aegis OS"                 # Human-readable name
AEGIS_ID="aegis"                      # os-release ID / package prefix / hostname
AEGIS_CODENAME="Sentinel"             # Release codename
AEGIS_TAGLINE="Offensive & Defensive Security, Agent-Native"
AEGIS_URL="https://github.com/shreyaskalyani3/Aegis-OS"
AEGIS_VENDOR="Aegis OS Project"

# --- Versioning --------------------------------------------------------------
# ISO version defaults to the build date (YYYY.MM.DD) unless AEGIS_VERSION is set.
AEGIS_VERSION="${AEGIS_VERSION:-}"    # e.g. 2026.08.23 ; empty => date at build time

# --- Live system defaults ----------------------------------------------------
# The two passwords below are baked into the ISO at build time (build-iso.sh
# writes them to /etc/aegis/credentials.conf, which aegis-credentials reads at
# boot). Any characters are safe — the file is generated with printf %q. The
# build verifies the file parses back to these exact values and aborts if not,
# so a typo here fails the build instead of locking you out of the ISO.
AEGIS_HOSTNAME="aegis"
AEGIS_LIVE_USER="aegis"               # Live session username
AEGIS_LIVE_PASSWORD="aegis"           # Live session password (change for prod!)
AEGIS_ROOT_PASSWORD="aegis"           # Root password on the live image
AEGIS_DEFAULT_SHELL="/usr/bin/zsh"
AEGIS_TIMEZONE="UTC"
AEGIS_LOCALE="en_US.UTF-8"
AEGIS_KEYMAP="us"

# --- Desktop -----------------------------------------------------------------
AEGIS_DESKTOP="xfce"                  # xfce | kde | i3 | gnome  (build wires xfce)

# --- AI agents baked into the image ------------------------------------------
# Space separated. Recognized: claude-code opencode aider codex
AEGIS_AI_AGENTS="claude-code opencode aider codex"

# --- Repositories ------------------------------------------------------------
# BlackArch gives the 2800+ tool arsenal. Chaotic-AUR is optional convenience.
AEGIS_ENABLE_BLACKARCH=1
AEGIS_ENABLE_CHAOTIC=0
AEGIS_BLACKARCH_STRAP_URL="https://blackarch.org/strap.sh"

# --- Baked-in tool coverage (how much of the arsenal ships INSIDE the ISO) ---
#   lean  = unified standard production ISO (~4.5 GB) — curated core security
#           tools (Nmap, Wireshark, Metasploit, Aircrack, John, Hashcat, Hydra,
#           SQLMap, Gobuster, Nikto, etc.) + full XFCE desktop, AI agents, and
#           Calamares installer. All 2,800+ remaining BlackArch tools are ready
#           on demand post-boot via `aegis-tools` or `pacman`.
#   broad = curated + 18 category groups (~27 GB)
#   full  = the ENTIRE blackarch group (~2800 tools, ~30 GB)
# -----------------------------------------------------------------------------
AEGIS_TOOL_SET="${AEGIS_TOOL_SET:-lean}"

# Category groups baked in when AEGIS_TOOL_SET=broad (BlackArch must be enabled).
# Tune freely — this list mirrors the categories `aegis-tools` advertises, so
# the baked-in image and the on-demand menu stay consistent. Add e.g.
# blackarch-database blackarch-voip if you want more.
# DoS and self-propagating "backdoor" groups are intentionally excluded from the
# baked-in default; install them explicitly, post-boot, for authorized testing.
AEGIS_BLACKARCH_GROUPS="${AEGIS_BLACKARCH_GROUPS:-blackarch-scanner blackarch-recon blackarch-webapp blackarch-fuzzer blackarch-exploitation blackarch-cracker blackarch-wireless blackarch-sniffer blackarch-proxy blackarch-forensic blackarch-reversing blackarch-crypto blackarch-windows blackarch-defensive blackarch-malware blackarch-mobile blackarch-social blackarch-networking}"

# Local repository built from ./packages (holds the aegis-* packages).
AEGIS_LOCAL_REPO_NAME="aegis"

# --- Build layout (relative to repo root) ------------------------------------
AEGIS_PROFILE_DIR="profile"
AEGIS_PACKAGES_DIR="packages"
AEGIS_OUT_DIR="out"
AEGIS_WORK_DIR="work"
AEGIS_REPO_OUT="${AEGIS_WORK_DIR}/localrepo"   # where built aegis packages land
