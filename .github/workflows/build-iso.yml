name: Build Aegis OS ISO

# -----------------------------------------------------------------------------
# Building an Arch ISO needs a real Arch userland, running as root, with mount/
# loop-device access. The GitHub `ubuntu-latest` runner is none of those — it is
# Ubuntu, it runs as the unprivileged `runner` user, and `scripts/build-iso.sh`
# correctly refuses to run there (require_root / is_arch).
#
# So the runner is used only as a host for a --privileged `archlinux:latest`
# container, and the real build happens INSIDE that container (root + Arch +
# loop devices). This is the same pattern as scripts/build-docker.sh.
# -----------------------------------------------------------------------------

on:
  # Manual runs (Actions tab -> "Build Aegis OS ISO" -> Run workflow).
  workflow_dispatch:
    inputs:
      tool_set:
        description: "Baked-in tool coverage (lean: standard ~4.8 GB production ISO)"
        type: choice
        options: [lean, broad, full]
        default: lean
      enable_blackarch:
        description: "Include the BlackArch repo / arsenal"
        type: boolean
        default: true
  # Version tags produce a downloadable Release.
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to attach the ISO to a Release on tags
  actions: write         # needed to delete previous artifacts when quota is full

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    # The full build needs ~3h on a free runner (run #38 was killed at 84% of
    # mksquashfs by a 150-min cap; run #72 was cancelled at exactly 120 min
    # with the build still running). 360 is GitHub's job maximum.
    timeout-minutes: 360
    env:
      # github.event.inputs.* are strings ("true"/"false"/""); this keeps the
      # logic robust whether triggered manually or by a tag push (no inputs).
      # Empty values deliberately fall back to aegis.conf inside the
      # container, keeping tag builds aligned with the central defaults.
      AEGIS_TOOL_SET: ${{ github.event.inputs.tool_set || '' }}
      AEGIS_ENABLE_BLACKARCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.enable_blackarch == 'true' && '1' || '0') || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build and profile configuration
        run: |
          bash scripts/dev/check-build-config.sh
          bash scripts/dev/check-profile.sh
          bash scripts/dev/test-shortcuts.sh
          python3 scripts/dev/test-session-startup.py
          bash scripts/dev/test-boot-profile.sh

      - name: Delete previous workflow artifacts
        # Artifact storage is account/repo-wide. Large ISO artifacts can
        # exhaust it, after which the next upload fails with
        # "Artifact storage quota has been hit". Delete artifacts from
        # previous runs before the long build, so the current run has room.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${CURRENT_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "CURRENT_RUN_ID is not numeric: ${CURRENT_RUN_ID}" >&2
            exit 1
          }
          old_ids="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${CURRENT_RUN_ID}) | .id" 2>/dev/null || true)"
          if [[ -z "${old_ids}" ]]; then
            echo "No previous artifacts to delete."
            exit 0
          fi
          echo "Deleting previous artifacts:"
          echo "${old_ids}"
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" 2>/dev/null || true
          done <<< "${old_ids}"

      - name: Free up runner disk space & configure high-capacity scratch storage
        # `broad` needs ~8-16 GB; the runner's root fs only has ~14 GB free by
        # default. Dropping the preinstalled toolchains we don't use buys ~25 GB.
        # Furthermore, GitHub runners carry ~65+ GB on /mnt; we bind work/ and
        # the pacman cache there so the build will never hit an out-of-disk error.
        run: |
          echo "=== Root disk before cleanup ==="
          df -h / /mnt || true

          echo "=== Cleaning apt caches & lists ==="
          sudo rm -rf /var/cache/apt /var/lib/apt/lists/* 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

          echo "=== Pruning Docker system & volumes ==="
          sudo docker system prune -af --volumes 2>/dev/null || true

          echo "=== Removing unneeded preinstalled toolchains ==="
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /usr/local/lib/node_modules \
            /usr/share/ruby* \
            /usr/local/julia* \
            "${AGENT_TOOLSDIRECTORY:-}" \
            2>/dev/null || true

          echo "=== Disabling swap to reclaim /mnt space ==="
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true

          echo "=== Setting up storage mounts ==="
          sudo mkdir -p /mnt/aegis-work /home/runner/pacman-cache
          sudo chmod 777 /mnt/aegis-work /home/runner/pacman-cache
          mkdir -p work out
          echo "=== Disks after setup ==="
          df -h / /mnt

      - name: Build the ISO inside a privileged Arch container
        # The log is captured on the HOST by piping `docker run` through tee.
        # Teeing from inside the container is unreliable: if the container is
        # killed (OOM, daemon restart) its tee dies with it and the artifact
        # step has nothing to upload. Capturing outside survives any exit.
        run: |
          mkdir -p work
          set -o pipefail
          docker run --rm --privileged \
            -v "$PWD":/aegis -w /aegis \
            -v /mnt/aegis-work:/aegis/work \
            -v /home/runner/pacman-cache:/var/cache/pacman/pkg \
            -e AEGIS_TOOL_SET \
            -e AEGIS_ENABLE_BLACKARCH \
            -e TERM=dumb \
            archlinux:latest bash -eo pipefail -c '
              echo "==> Container preflight"
              pacman -V | head -1

              # 1. Pin real mirrors. The image default is the geo CDN, which
              #    has stalled/timed out repeatedly in this repo history.
              #    pacman tries these in order; ParallelDownloads parallelises
              #    within the first responsive one.
              printf "%s\n" \
                "Server = https://mirror.rackspace.com/archlinux/\$repo/os/\$arch" \
                "Server = https://mirrors.kernel.org/archlinux/\$repo/os/\$arch" \
                "Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" \
                > /etc/pacman.d/mirrorlist
              cat /etc/pacman.d/mirrorlist

              # 2. Initialise/populate the keyring. A fresh archlinux image can
              #    have no populated keyring, which makes every pacman sync fail
              #    deterministically with a PGP error. Both commands are
              #    idempotent; failures here are surfaced, not swallowed.
              pacman-key --init
              pacman-key --populate archlinux || true

              # 3. Keyring package with visible retries and diagnostics.
              ok=0
              for i in 1 2 3 4 5; do
                if pacman -Sy --noconfirm archlinux-keyring; then ok=1; break; fi
                echo "!! keyring sync attempt ${i}/5 failed"
                sleep 10
              done
              if [ "$ok" -ne 1 ]; then
                echo "=== DIAGNOSTICS: mirror reachability ==="
                for m in https://mirror.rackspace.com/archlinux/core/os/x86_64/core.db \
                         https://mirrors.kernel.org/archlinux/core/os/x86_64/core.db \
                         https://geo.mirror.pkgbuild.com/core/os/x86_64/core.db; do
                  curl -sI --max-time 10 -o /dev/null -w "%{http_code} %{time_total}s $m\n" "$m" || echo "FAIL $m"
                done
                echo "=== DIAGNOSTICS: pacman.conf ==="
                grep -vE "^\s*#|^\s*$" /etc/pacman.conf
                exit 1
              fi

              echo "==> Building Aegis OS (tool set: ${AEGIS_TOOL_SET}, blackarch: ${AEGIS_ENABLE_BLACKARCH})"
              bash scripts/build-iso.sh
            ' 2>&1 | tee build.log; rc=${PIPESTATUS[0]}
          echo "--- container exit code: ${rc} ---" | tee -a build.log
          cp -f build.log /mnt/aegis-work/build.log 2>/dev/null || true
          exit "$rc"

      - name: Upload build log (always)
        # Job logs need a GitHub login to read; this artifact is the
        # authenticated-free record of what happened, including failures.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          name: build-log
          path: |
            build.log
            work/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Debug failure details
        if: failure()
        run: |
          echo "=== Disk usage on runner ==="
          df -h / /mnt || true
          echo "=== Scratch storage contents ==="
          ls -la /mnt/aegis-work 2>/dev/null || true
          ls -la /home/runner/pacman-cache 2>/dev/null || true
          echo "=== Output directory ==="
          ls -la out/ 2>/dev/null || true
          for f in build.log /mnt/aegis-work/build.log; do
            [[ -f "$f" ]] || continue
            echo "=== tail -100 of ${f} ==="
            tail -100 "$f" || true
          done

      - name: Normalize output ownership
        # Files created by root inside the container are root-owned on the host;
        # chown them back so the unprivileged upload step can read them.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out work /mnt/aegis-work /home/runner/pacman-cache 2>/dev/null || true

      - name: List build output
        if: always()
        run: ls -lh out/ 2>/dev/null || echo "no out/ directory (build failed before producing an ISO)"

      - name: Delete previous workflow artifacts
        # Artifact storage quota is account/repo-wide. Keeping a 14-day ISO
        # artifact from every run can exhaust it, after which the next upload
        # fails with "Artifact storage quota has been hit". Delete artifacts
        # from previous runs before creating the new one. Tag builds also
        # publish a Release, so the current artifact is the only one needed.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          old_ids="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != \"$current\") | .id" 2>/dev/null || true)"
          if [[ -z "${old_ids}" ]]; then
            echo "No previous artifacts to delete."
            exit 0
          fi
          echo "Deleting previous artifacts:"
          echo "${old_ids}"
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" 2>/dev/null || true
          done <<< "${old_ids}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        env:
          # Node 24's punycode deprecation warning is noise from the action,
          # not a build failure. Keep deprecation output out of the ISO logs.
          NODE_OPTIONS: --no-deprecation
        with:
          name: aegis-os-iso
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Release Assets (split ISO if > 2GB)
        # GitHub Releases strictly limits individual asset files to < 2 GiB (2147483648 bytes).
        # Standard desktop ISOs are ~4.8 GB. We split files >= 2000 MB into 1900 MB parts
        # and provide one-click recombine scripts (join-iso.sh and join-iso.bat).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          cp out/*.sha256 release-assets/ 2>/dev/null || true

          for iso in out/*.iso; do
            [[ -f "$iso" ]] || continue
            filename="$(basename "$iso")"
            filesize=$(stat -c%s "$iso")

            if [ "$filesize" -ge 2097152000 ]; then
              echo "ISO $filename is ${filesize} bytes (> 2 GiB). Splitting into 1900MB parts for GitHub Release..."
              split -b 1900M -d "$iso" "release-assets/${filename}.part"
              cp scripts/release/join-iso.sh release-assets/
              cp scripts/release/join-iso.bat release-assets/
              chmod +x release-assets/join-iso.sh
            else
              echo "ISO $filename is ${filesize} bytes (<= 2 GiB). Copying directly."
              cp "$iso" release-assets/
            fi
          done

          echo "=== Release Assets to upload ==="
          ls -lh release-assets/

      - name: Publish Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### 🛡️ Aegis OS Release

            > [!TIP]
            > **Single-file Direct Download**: You can also download the complete, un-split ISO in one file directly from the **Artifacts** section of the [Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            #### Recombining Multi-Part ISO:
            GitHub Releases enforce a 2 GiB per-file limit, so this ISO is split into 1.9 GB parts (`.part00`, `.part01`, ...).
            
            - **Linux / macOS**:
              Run `./join-iso.sh` (or `cat *.iso.part* > aegis-os.iso`)
            - **Windows**:
              Double-click `join-iso.bat` (or in CMD: `copy /b *.iso.part* aegis-os.iso`)
