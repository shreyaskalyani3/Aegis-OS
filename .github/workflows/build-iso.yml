name: Build Aegis OS ISO

# -----------------------------------------------------------------------------
# Building an Arch ISO needs a real Arch userland, running as root, with mount/
# loop-device access. The GitHub `ubuntu-latest` runner is none of those — it is
# Ubuntu, it runs as the unprivileged `runner` user, and `scripts/build-iso.sh`
# correctly refuses to run there (require_root / is_arch).
#
# So the runner is used only as a host for a --privileged `archlinux:latest`
# container, and the real build happens INSIDE that container (root + Arch +
# loop devices). This is the same pattern as scripts/build-docker.sh.
# -----------------------------------------------------------------------------

on:
  # Manual runs (Actions tab -> "Build Aegis OS ISO" -> Run workflow).
  workflow_dispatch:
    inputs:
      tool_set:
        description: "Baked-in tool coverage (lean: standard ~4.8 GB production ISO)"
        type: choice
        options: [lean, broad, full]
        default: lean
      enable_blackarch:
        description: "Include the BlackArch repo / arsenal"
        type: boolean
        default: true
  # Version tags produce a downloadable Release.
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to attach the ISO to a Release on tags
  actions: write         # needed to delete previous artifacts when quota is full

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # github.event.inputs.* are strings ("true"/"false"/""); this keeps the
      # logic robust whether triggered manually or by a tag push (no inputs).
      AEGIS_TOOL_SET: ${{ github.event.inputs.tool_set || 'lean' }}
      AEGIS_ENABLE_BLACKARCH: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.enable_blackarch == 'true') && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete previous workflow artifacts
        # Artifact storage is account/repo-wide. Large ISO artifacts can
        # exhaust it, after which the next upload fails with
        # "Artifact storage quota has been hit". Delete artifacts from
        # previous runs before the long build, so the current run has room.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${CURRENT_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "CURRENT_RUN_ID is not numeric: ${CURRENT_RUN_ID}" >&2
            exit 1
          }
          old_ids="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${CURRENT_RUN_ID}) | .id" 2>/dev/null || true)"
          if [[ -z "${old_ids}" ]]; then
            echo "No previous artifacts to delete."
            exit 0
          fi
          echo "Deleting previous artifacts:"
          echo "${old_ids}"
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" 2>/dev/null || true
          done <<< "${old_ids}"

      - name: Free up runner disk space & configure high-capacity scratch storage
        # `broad` needs ~8-16 GB; the runner's root fs only has ~14 GB free by
        # default. Dropping the preinstalled toolchains we don't use buys ~25 GB.
        # Furthermore, GitHub runners carry ~65+ GB on /mnt; we bind work/ and
        # the pacman cache there so the build will never hit an out-of-disk error.
        run: |
          echo "=== Root disk before cleanup ==="
          df -h / /mnt || true

          echo "=== Cleaning apt caches & lists ==="
          sudo rm -rf /var/cache/apt /var/lib/apt/lists/* 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

          echo "=== Pruning Docker system & volumes ==="
          sudo docker system prune -af --volumes 2>/dev/null || true

          echo "=== Removing unneeded preinstalled toolchains ==="
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /usr/local/lib/node_modules \
            /usr/share/ruby* \
            /usr/local/julia* \
            "${AGENT_TOOLSDIRECTORY:-}" \
            2>/dev/null || true

          echo "=== Disabling swap to reclaim /mnt space ==="
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true

          echo "=== Setting up storage mounts ==="
          sudo mkdir -p /mnt/aegis-work /home/runner/pacman-cache
          sudo chmod 777 /mnt/aegis-work /home/runner/pacman-cache
          mkdir -p work out
          echo "=== Disks after setup ==="
          df -h / /mnt

      - name: Build the ISO inside a privileged Arch container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/aegis -w /aegis \
            -v /mnt/aegis-work:/aegis/work \
            -v /home/runner/pacman-cache:/var/cache/pacman/pkg \
            -e AEGIS_TOOL_SET \
            -e AEGIS_ENABLE_BLACKARCH \
            archlinux:latest bash -eo pipefail -c '
              echo "==> Refreshing pacman keyring"
              pacman -Sy --noconfirm archlinux-keyring
              echo "==> Building Aegis OS (tool set: ${AEGIS_TOOL_SET}, blackarch: ${AEGIS_ENABLE_BLACKARCH})"
              bash scripts/build-iso.sh
            '

      - name: Debug failure details
        if: failure()
        run: |
          echo "=== Disk usage on runner ==="
          df -h / /mnt || true
          echo "=== Scratch storage contents ==="
          ls -la /mnt/aegis-work 2>/dev/null || true
          ls -la /home/runner/pacman-cache 2>/dev/null || true
          echo "=== Output directory ==="
          ls -la out/ 2>/dev/null || true

      - name: Normalize output ownership
        # Files created by root inside the container are root-owned on the host;
        # chown them back so the unprivileged upload step can read them.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out work /mnt/aegis-work /home/runner/pacman-cache 2>/dev/null || true

      - name: List build output
        if: always()
        run: ls -lh out/ 2>/dev/null || echo "no out/ directory (build failed before producing an ISO)"

      - name: Delete previous workflow artifacts
        # Artifact storage quota is account/repo-wide. Keeping a 14-day ISO
        # artifact from every run can exhaust it, after which the next upload
        # fails with "Artifact storage quota has been hit". Delete artifacts
        # from previous runs before creating the new one. Tag builds also
        # publish a Release, so the current artifact is the only one needed.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          old_ids="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != \"$current\") | .id" 2>/dev/null || true)"
          if [[ -z "${old_ids}" ]]; then
            echo "No previous artifacts to delete."
            exit 0
          fi
          echo "Deleting previous artifacts:"
          echo "${old_ids}"
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" 2>/dev/null || true
          done <<< "${old_ids}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        env:
          # Node 24's punycode deprecation warning is noise from the action,
          # not a build failure. Keep deprecation output out of the ISO logs.
          NODE_OPTIONS: --no-deprecation
        with:
          name: aegis-os-iso
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
          generate_release_notes: true

