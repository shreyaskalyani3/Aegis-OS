name: Build Aegis OS ISO

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tool_set:
        description: "Select Aegis OS tool set"
        required: true
        default: lean
        type: choice
        options:
          - lean
          - broad

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build scripts executable
        run: |
          chmod +x scripts/build-iso.sh
          chmod +x scripts/lib/common.sh

      - name: Build Aegis OS ISO
        env:
          AEGIS_TOOL_SET: ${{ inputs.tool_set || 'broad' }}
        run: |
          echo "Building Aegis OS"
          echo "Tool set: $AEGIS_TOOL_SET"
          ./scripts/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: aegis-os-iso
          path: |
            **/*.iso
